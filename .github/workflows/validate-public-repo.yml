name: Validate public repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck

      - name: Validate shell syntax
        run: bash -n scripts/validate_public_repo.sh

      - name: Run ShellCheck
        run: shellcheck scripts/validate_public_repo.sh

      - name: Validate public snapshot
        run: bash scripts/validate_public_repo.sh
